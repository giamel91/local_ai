# =========================================================================
#  PROFILE: aws   --   managed services on AWS
#
#    chat          ->  Amazon Bedrock, Qwen3 32B (Converse API)
#    embeddings    ->  Amazon Bedrock, Titan Text Embeddings v2
#    vector store  ->  ChromaDB   (see Phase 6 - host it on AWS)
#    messaging     ->  Kafka      (see Phase 6 - or Amazon MSK)
# =========================================================================

# Several providers sit on the classpath, so select Bedrock explicitly.
spring.ai.model.chat=bedrock-converse
spring.ai.model.embedding=bedrock-titan

# Spring AI disables individual Bedrock models by default - each one must be
# switched on explicitly, otherwise no ChatModel/EmbeddingModel bean is created.
spring.ai.bedrock.converse.chat.enabled=true
spring.ai.bedrock.titan.embedding.enabled=true

# --- Amazon Bedrock ---
# The region must host the Qwen3 32B model.
# Available in: us-east-1, us-east-2, us-west-2, eu-west-1, eu-west-2,
#               eu-central-1, eu-north-1, eu-south-1 (Milan), ap-*, sa-east-1
spring.ai.bedrock.aws.region=${AWS_REGION:eu-south-1}

# Credentials: never hard-code keys here.
# On AWS the SDK automatically uses the IAM role (App Runner / ECS / EC2 instance
# profile). For local testing, export AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY
# or configure ~/.aws/credentials.

# Qwen3 32B through the Bedrock Converse API (model id verified against AWS docs)
spring.ai.bedrock.converse.chat.options.model=${BEDROCK_CHAT_MODEL:qwen.qwen3-32b-v1:0}
spring.ai.bedrock.converse.chat.options.temperature=0.0

# Titan Text Embeddings v2 - replaces Ollama's nomic-embed-text
spring.ai.bedrock.titan.embedding.model=${BEDROCK_EMBEDDING_MODEL:amazon.titan-embed-text-v2:0}
# Spring AI 1.0.x defaults this to 'image', which makes Titan send a 1x1 PNG
# placeholder instead of the text, and Bedrock rejects it as a malformed request.
# This MUST be 'text' for a text embedding model.
spring.ai.bedrock.titan.embedding.input-type=text

# --- Vector store (still Chroma) ---
# Configured centrally in application.properties. See Phase 6 for hosting it
# on AWS (EKS/ECS) or replacing it with a managed vector store.

# --- Kafka / Amazon MSK ---
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${KAFKA_GROUP_ID:qwen-assistente-group}
