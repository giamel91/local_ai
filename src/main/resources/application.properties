spring.application.name=sample_ai

# ---------------------------------------------------------------------------
# Default profile = "local" (Ollama + Chroma + Kafka on your own machine).
# Switch to the AWS/Bedrock setup with:
#     -Dspring.profiles.active=aws      (or SPRING_PROFILES_ACTIVE=aws)
# Model/vector-store settings live in application-local.properties
# and application-aws.properties.
# ---------------------------------------------------------------------------
spring.profiles.default=local

# --- HTTP port (AWS sets PORT; defaults to 8080 locally) ---
server.port=${PORT:8080}

# --- CORS: which frontend origins may call this API ---
# Locally Angular runs on :4200. On AWS this becomes your S3/CloudFront URL.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# --- ChromaDB (vector store) ---
# Identical in every environment; only the address changes, via env vars.
#
# Chroma 1.0 no longer lets clients create tenants/databases, and Spring AI
# defaults to 'SpringAiTenant'/'SpringAiDatabase' which don't exist there, so we
# point at the tenant and database Chroma actually ships with.
spring.ai.vectorstore.chroma.client.host=${CHROMA_HOST:http://localhost}
spring.ai.vectorstore.chroma.client.port=${CHROMA_PORT:8000}
spring.ai.vectorstore.chroma.tenant-name=${CHROMA_TENANT:default_tenant}
spring.ai.vectorstore.chroma.database-name=${CHROMA_DATABASE:default_database}
spring.ai.vectorstore.chroma.collection-name=${CHROMA_COLLECTION:sample_ai_code}
spring.ai.vectorstore.chroma.initialize-schema=true

# --- Kafka ---
# No Kafka broker is running yet (Amazon MSK is a later phase). Without these
# settings every /api/ai/generate call blocks ~60s while the producer times out,
# and the consumer floods the logs with reconnect attempts.
# The broker address itself is set per profile.
spring.kafka.listener.auto-startup=false
spring.kafka.producer.properties.max.block.ms=2000
spring.kafka.producer.properties.request.timeout.ms=2000
spring.kafka.producer.properties.delivery.timeout.ms=2000