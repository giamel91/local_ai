# =========================================================================
#  PROFILE: local   --   everything runs on your own machine
#
#    chat + embeddings  ->  Ollama
#    vector store       ->  ChromaDB
#    messaging          ->  Kafka
# =========================================================================

# When several providers are on the classpath, Spring AI needs to know which
# one to auto-configure for each model type.
spring.ai.model.chat=ollama
spring.ai.model.embedding=ollama

# --- Ollama (local LLM) ---
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.chat.options.model=${OLLAMA_CHAT_MODEL:qwen2.5:7b}
spring.ai.ollama.chat.options.temperature=0.0
spring.ai.ollama.embedding.options.model=${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}

# --- ChromaDB (vector store) ---
# Configured centrally in application.properties.

# --- Kafka (response history) ---
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${KAFKA_GROUP_ID:qwen-assistente-group}
