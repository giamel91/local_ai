# =============================================================================
#  Deployment stack for the EC2 host
#
#     api     -> Spring Boot app (image pulled from ECR), calling Amazon Bedrock
#     chroma  -> ChromaDB vector store with a persistent named volume
#     nginx   -> TLS terminator: https://arlingtonqwen.duckdns.org -> api:8080
#
#  Only nginx publishes ports (80, 443). The API itself is bound to loopback.
#
#  Usage on the EC2 instance:
#     export ECR_IMAGE=<account-id>.dkr.ecr.eu-south-1.amazonaws.com/sample-ai-api:latest
#     docker compose up -d
#
#  NOTE: no AWS credentials appear in this file. The app picks up the EC2
#  instance role automatically through the AWS SDK default credential chain.
# =============================================================================

services:

  chroma:
    image: chromadb/chroma:1.0.0
    container_name: chroma
    restart: unless-stopped
    volumes:
      # Chroma keeps chroma.sqlite3 and its indexes under /data. The named
      # volume makes your ingested documents survive container restarts.
      - chroma-data:/data

  api:
    image: ${ECR_IMAGE:?ECR_IMAGE must be set to the ECR image URI}
    container_name: sample-ai-api
    restart: unless-stopped
    depends_on:
      - chroma
    ports:
      # Bound to loopback only: the public entry point is the nginx service,
      # which proxies over the compose network. This port is for local debugging.
      - "127.0.0.1:8080:8080"
    environment:
      # Use the Bedrock configuration instead of local Ollama.
      SPRING_PROFILES_ACTIVE: aws
      AWS_REGION: eu-south-1
      # Containers on the same compose network reach each other by service name.
      CHROMA_HOST: http://chroma
      CHROMA_PORT: "8000"
      CHROMA_COLLECTION: sample_ai_code
      # Comma-separated. Add the CloudFront domain here once the frontend is deployed.
      CORS_ALLOWED_ORIGINS: "https://arlingtonqwen.duckdns.org,http://localhost:4200"
      # nginx terminates TLS, so Spring Boot must trust X-Forwarded-* headers.
      SERVER_FORWARD_HEADERS_STRATEGY: framework

  nginx:
    image: nginx:1.27-alpine
    container_name: nginx
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # Certificates issued by acme.sh on the host (DNS-01, DuckDNS).
      - ./certs:/etc/nginx/certs:ro
      # Angular build output (dist/sample_ai_frontend/browser), copied with scp.
      - ./frontend:/usr/share/nginx/html:ro


volumes:
  chroma-data:
