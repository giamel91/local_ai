# TLS terminator for the sample_ai API.
#
#   Internet --443(https)--> nginx --8080(http, docker network)--> api
#
# Certificates are issued by acme.sh with the DuckDNS DNS-01 challenge and
# installed into /home/ec2-user/app/certs, mounted read-only at /etc/nginx/certs.

upstream api_backend {
    server api:8080;
}

server {
    listen 80;
    server_name arlingtonqwen.duckdns.org 18.102.200.77;

    # No plaintext API access: everything goes to https.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name arlingtonqwen.duckdns.org;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 2m;

    location /api/ {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Bedrock can be slow; Spring Boot needs the time to answer.
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }

    location = /health {
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # The Angular build is served from this same origin, so its /api/ calls are
    # same-origin: no CORS, no separate hostname, no second certificate.
    root /usr/share/nginx/html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Content-hashed filenames never change, so cache them hard.
    location ~* \.(?:js|css|ico|woff2?|svg)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html must never be cached, otherwise a deploy stays invisible.
    location = /index.html {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    # SPA fallback: unknown paths are routes for the client, not missing files.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
